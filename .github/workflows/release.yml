name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm check:ui-boundary
          pnpm pack:check

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Pack reviewed artifact
        id: pack
        run: |
          npm pack --json > pack.json
          PACKAGE_FILE=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('pack.json','utf8')); process.stdout.write(p[0].filename)")
          shasum -a 256 "$PACKAGE_FILE" > "$PACKAGE_FILE.sha256"
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish with npm provenance
        run: npm publish "${{ steps.pack.outputs.file }}" --access public --provenance

      - name: Attach exact package and digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --clobber
